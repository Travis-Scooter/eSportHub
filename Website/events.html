<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventek - eSportHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="logo.png" alt="eSportHub Logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="events.html">Eventek</a></li>
                <li><a href="players.html">Játékosok</a></li>
                <li><a href="games.html">Játékok</a></li>
            </ul>
        </nav>
    </header>

    <div class="page-container">
        <aside class="sorting-panel">
            <h3>Szűrő opciók</h3>
            <label for="sort-events">Rendezés:</label>
            <select id="sort-events">
                <option value="date">Dátum szerint</option>
                <option value="popularity">Népszerűség szerint</option>
            </select>
        </aside>

        <section class="event-list">
            <h1>Eventek</h1>
            <p>Browse the latest and upcoming eSport events.</p>
            <div class="event-item">
                <h2>Event 1</h2>
                <p>Details about Event 1</p>
            </div>
            <div class="event-item">
                <h2>Event 2</h2>
                <p>Details about Event 2</p>
            </div>
            <div class="event-item">
                <h2>Event 3</h2>
                <p>Details about Event 3</p>
            </div>
        </section>
    </div>

    <footer>
        <p>&copy; 2025 eSportHub</p>
    </footer>
</body>
</html>
